# Opcional — só para quem já tem Docker. Uso: docker compose run --rm cypress
# Roda headless dentro do container (Node + Cypress + Chrome/Electron já inclusos).
services:
  cypress:
    image: cypress/included:15.21.1
    working_dir: /e2e
    volumes:
      - ./:/e2e
      - /e2e/node_modules # node_modules fica só no container (não mistura com o do seu PC)
    entrypoint: ['bash', '-c', 'npm ci --no-audit --no-fund && cypress run "$$@"', '--']
